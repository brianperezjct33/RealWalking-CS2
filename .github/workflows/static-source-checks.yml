name: Static source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project inputs, metadata and critical gameplay contracts
        run: python tools/check_release_structure.py
      - name: Validate translations
        run: python tools/check_rw_localization.py
      - name: Check documentation links
        run: python tools/check_documentation_links.py
